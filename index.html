<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="description" content="Tuesday strength, Thursday intervals, hip flow, and an easy weekend hike.">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<title>Training</title>
<style>
  :root {
    --bg: #f4efe6;
    --bg-deep: #ebe3d4;
    --surface: #fffdf8;
    --ink: #1c1915;
    --soft: #5e584e;
    --faint: #8a8174;
    --line: #e4d9c6;
    --pine: #1f4d3a;
    --pine-deep: #16382a;
    --sage: #1f7a4d;
    --sage-soft: #e7f4ec;
    --amber: #9a4e24;
    --amber-soft: #f8ecdf;
    --sky: #2f5f86;
    --danger: #8d342c;
    --shadow: 0 10px 28px rgba(48, 36, 18, 0.06);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, ui-serif, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.45; }
  body { min-height: 100dvh; padding-bottom: calc(112px + env(safe-area-inset-bottom, 0)); }
  button, input, textarea, label { font: inherit; color: inherit; scroll-margin-bottom: 120px; }
  button { background: none; border: none; cursor: pointer; }
  input, textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 16px; }
  input:focus, textarea:focus { outline: 2px solid var(--pine); border-color: transparent; }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
  #app { max-width: 680px; margin: 0 auto; padding: 18px 18px 28px; }
  .eyebrow { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); font-weight: 700; }
  h1 { font-family: var(--serif); font-size: clamp(36px, 9vw, 48px); line-height: 0.98; font-weight: 600; letter-spacing: -0.03em; margin: 4px 0 8px; }
  h2 { font-family: var(--serif); font-size: 30px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; }
  .encourage { color: var(--soft); font-size: 17px; max-width: 38ch; }
  .top-row, .weekline, .split, .section-head, .card-top, .check-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .sync { min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--pine); font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .sync[data-state="synced"] { background: var(--sage-soft); border-color: transparent; }
  .sync[data-state="syncing"] { color: var(--soft); }
  .weekline { align-items: center; margin: 18px 0 12px; }
  .weekline strong { display: block; font-size: 16px; }
  .weekline button.arrow { width: 48px; height: 48px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font-size: 26px; line-height: 1; }
  .weekline button.arrow:disabled { opacity: 0.35; }
  .now, .text-btn { color: var(--pine); font-size: 14px; font-weight: 700; }
  .text-btn { min-height: 36px; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0 14px; }
  .slots button { min-height: 52px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 15px; position: relative; }
  .slots button.on { background: var(--pine); color: white; border-color: var(--pine); }
  .slots button.met::after { content: ""; position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--sage); }
  .slots button.on.met::after { background: #d7f5e2; }
  .pieces { color: var(--soft); font-size: 15px; margin-bottom: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card.done { background: #f7fbf8; border-color: #b7d7c4; }
  .kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
  .card h3 { font-size: 22px; line-height: 1.15; letter-spacing: -0.02em; }
  .dose { color: var(--pine); font-weight: 700; font-size: 15px; margin-top: 4px; }
  .equip { color: var(--faint); font-size: 14px; margin-top: 2px; }
  .cue { color: var(--soft); font-size: 15.5px; margin: 10px 0 14px; }
  .primary, .ghost, .danger { width: 100%; min-height: 56px; border-radius: 16px; font-weight: 700; font-size: 17px; }
  .primary { background: var(--pine); color: white; }
  .primary:active { background: var(--pine-deep); }
  .primary.done { background: transparent; color: var(--sage); border: 2px solid var(--sage); }
  .ghost { background: transparent; color: var(--pine); border: 1px dashed var(--line); margin-top: 8px; }
  .danger { background: transparent; color: var(--danger); border: 1px solid #e4b2ad; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; color: var(--faint); font-size: 18px; flex-shrink: 0; }
  .set { display: grid; grid-template-columns: 54px 1fr 1fr; gap: 8px; align-items: end; margin-bottom: 8px; }
  .set.one { grid-template-columns: 54px 1fr; }
  .set span { font-size: 13px; font-weight: 700; color: var(--faint); padding-bottom: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--soft); }
  .interval { display: grid; grid-template-columns: 1fr 96px; gap: 8px; align-items: center; }
  .interval button { min-height: 64px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); text-align: left; padding: 10px 14px; }
  .interval button strong { display: block; font-size: 17px; }
  .interval button em { font-style: normal; color: var(--soft); font-size: 14px; }
  .interval button.on { background: var(--sage-soft); border-color: var(--sage); }
  .rest { text-align: center; color: var(--faint); font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin: 8px 0; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 12px 0; }
  .days button { min-height: 58px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; font-weight: 700; }
  .days button small { display: block; color: var(--faint); font-weight: 600; }
  .days button.on { background: var(--pine); color: white; border-color: var(--pine); }
  .days button.on small { color: #d7efe2; }
  .days button.met { box-shadow: inset 0 -3px 0 var(--sage); }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .choice button { min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); font-weight: 700; }
  .choice button.on { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
  .banner { background: var(--sage-soft); color: var(--pine-deep); border-radius: 18px; padding: 16px 18px; margin-bottom: 12px; }
  .banner strong { display: block; font-size: 18px; }
  .link-card { display: block; width: 100%; text-align: left; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .check { margin-bottom: 18px; }
  .scores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px; }
  .scores button { min-height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; font-weight: 700; }
  .scores button.on { background: var(--pine); color: white; border-color: var(--pine); }
  .word { min-height: 1.2em; color: var(--pine); font-weight: 700; font-size: 14px; margin-top: 6px; }
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; align-items: center; min-height: 72px; box-shadow: var(--shadow); }
  .row b { display: block; font-size: 17px; color: var(--ink); }
  .row span { color: var(--soft); font-size: 14px; }
  .pill { min-width: 72px; text-align: right; font-weight: 700; color: var(--faint); }
  .row.met .pill { color: var(--sage); }
  .hero { padding: 8px 0 18px; }
  .streak { font-family: var(--serif); font-size: 72px; line-height: 0.9; letter-spacing: -0.04em; }
  .legend, .dots { display: flex; gap: 6px; align-items: center; }
  .legend { color: var(--soft); font-size: 13px; margin: 8px 0 12px; flex-wrap: wrap; }
  .dot, .legend i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--line); display: inline-block; background: transparent; }
  .dot.on, .legend i.on { background: var(--pine); border-color: var(--pine); }
  .crow { display: flex; justify-content: space-between; align-items: center; min-height: 42px; gap: 12px; }
  .crow span { color: var(--soft); font-size: 14px; }
  .crow.now span { color: var(--ink); font-weight: 700; }
  svg.chart { width: 100%; height: auto; display: block; }
  .chart-card { overflow: hidden; }
  .empty { color: var(--soft); }
  .archive { margin: 8px 0 18px; }
  .archive summary { min-height: 52px; display: flex; align-items: center; font-weight: 700; cursor: pointer; }
  .session-old { border-top: 1px solid var(--line); padding: 12px 0; }
  .session-old b { display: block; }
  .session-old p { color: var(--soft); font-size: 15px; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .fine { color: var(--faint); font-size: 13px; }
  #sheet { position: fixed; inset: 0; z-index: 20; display: none; background: rgba(28, 25, 21, 0.35); padding: 18px; }
  #sheet.open { display: grid; align-items: end; }
  .sheet { background: var(--surface); border-radius: 24px; padding: 22px 18px calc(18px + env(safe-area-inset-bottom, 0)); width: min(560px, 100%); margin: 0 auto; box-shadow: var(--shadow); }
  .sheet p { color: var(--soft); margin: 8px 0 14px; }
  .err { color: var(--danger); font-weight: 700; min-height: 1.2em; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: rgba(255, 253, 248, 0.94); backdrop-filter: blur(16px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0); }
  .nav button { flex: 1; min-height: 64px; color: var(--faint); font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .nav button.on { color: var(--pine); }
  .nav svg { display: block; margin: 0 auto 3px; }
  @media (max-width: 360px) {
    h1 { font-size: 34px; }
    .interval { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior: auto; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<nav class="nav" id="nav">
  <button type="button" data-nav="today">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16M7 7v10M17 7v10"/></svg>
    Today
  </button>
  <button type="button" data-nav="week">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
    Week
  </button>
  <button type="button" data-nav="progress">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
    Progress
  </button>
</nav>
<script type="module" src="/app.js"></script>
</body>
</html>
