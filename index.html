<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strength">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<title>Strength — Foundation Program</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a0a;
    --surface: #161616;
    --surface-2: #1f1f1f;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;
    --text: #f5f5f0;
    --text-dim: #8a8a85;
    --text-faint: #555;
    --accent: #d4ff00;
    --accent-dim: #8aa800;
    --injection: #ff6b35;
    --rest: #4a9fff;
    --done: #5ad889;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; }
  body { min-height: 100dvh; padding-bottom: calc(72px + env(safe-area-inset-bottom, 0)); }
  .display { font-family: 'Anton', sans-serif; letter-spacing: 0.02em; text-transform: uppercase; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font-family: inherit; color: inherit; background: none; border: none; outline: none; }

  .topbar { position: sticky; top: 0; z-index: 50; background: rgba(10,10,10,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top, 0); }
  .topbar-row { padding: 14px 20px 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .week-label { font-size: 11px; color: var(--text-dim); letter-spacing: 0.18em; font-weight: 500; }
  .week-num { font-size: 28px; line-height: 1; margin-top: 2px; }
  .week-num .of { font-size: 14px; color: var(--text-faint); margin-left: 4px; }
  .phase-pill { font-size: 10px; letter-spacing: 0.15em; padding: 5px 10px; border: 1px solid var(--border-strong); border-radius: 100px; color: var(--text-dim); font-weight: 500; }
  .phase-pill.phase-2 { color: var(--accent); border-color: var(--accent-dim); background: rgba(212,255,0,0.06); }

  .day-tabs { display: flex; padding: 0 12px; border-top: 1px solid var(--border); }
  .day-tab { flex: 1; padding: 12px 4px; text-align: center; border-bottom: 2px solid transparent; color: var(--text-faint); transition: color 0.15s, border-color 0.15s; position: relative; }
  .day-tab .day-name { display: block; font-size: 9px; color: var(--text-faint); margin-bottom: 2px; letter-spacing: 0.12em; }
  .day-tab .day-letter { font-family: 'Anton', sans-serif; font-size: 15px; letter-spacing: 0.05em; }
  .day-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .day-tab.active .day-name { color: var(--text-dim); }
  .day-tab.today::after { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(20px); width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  main { max-width: 640px; margin: 0 auto; }

  .day-header { padding: 28px 20px 8px; }
  .day-header .focus { font-size: 10px; color: var(--text-dim); letter-spacing: 0.2em; margin-bottom: 6px; }
  .day-header h1 { font-size: 40px; line-height: 0.95; }
  .day-header h1 .sub { display: block; font-size: 15px; color: var(--accent); margin-top: 8px; letter-spacing: 0.05em; font-family: 'DM Sans', sans-serif; font-weight: 500; text-transform: none; }
  .day-header .session-meta { color: var(--text-dim); font-size: 13px; margin-top: 14px; line-height: 1.5; }
  .injection-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--injection); border: 1px solid var(--injection); background: rgba(255,107,53,0.08); padding: 4px 9px; font-size: 10px; letter-spacing: 0.12em; border-radius: 4px; margin-left: 8px; font-weight: 500; text-transform: uppercase; }

  .rest-day { padding: 50px 20px; text-align: center; }
  .rest-day .rest-icon { width: 60px; height: 60px; margin: 0 auto 24px; border: 2px solid var(--rest); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--rest); }
  .rest-day h1 { font-size: 46px; margin-bottom: 14px; }
  .rest-day .day-name-show { color: var(--rest); font-size: 13px; letter-spacing: 0.18em; margin-bottom: 8px; font-weight: 500; }
  .rest-day p { color: var(--text-dim); margin-bottom: 8px; line-height: 1.6; max-width: 320px; margin-left: auto; margin-right: auto; }
  .rest-day .next-up { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-top: 32px; text-align: left; }
  .rest-up-label { font-size: 10px; color: var(--text-faint); letter-spacing: 0.2em; margin-bottom: 8px; }
  .rest-up-name { font-size: 22px; font-family: 'Anton', sans-serif; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; }
  .rest-up-sub { color: var(--accent); font-size: 13px; margin-top: 6px; }
  .rest-up-date { color: var(--text-dim); font-size: 13px; margin-top: 10px; }

  .section { padding: 8px 20px 16px; border-top: 1px solid var(--border); margin-top: 20px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 0 12px; }
  .section-head .title { font-size: 11px; letter-spacing: 0.22em; font-weight: 500; color: var(--text-dim); }
  .section-head .duration { font-size: 11px; color: var(--text-faint); font-family: 'JetBrains Mono', monospace; }

  .ex { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; transition: border-color 0.2s, background 0.2s; }
  .ex.done { border-color: var(--done); background: rgba(90,216,137,0.04); }
  .ex-head { padding: 16px 18px 14px; display: flex; gap: 14px; align-items: flex-start; }
  .ex-main { flex: 1; min-width: 0; }
  .ex-name { font-size: 17px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
  .ex-equip { font-size: 11.5px; color: var(--text-faint); letter-spacing: 0.03em; }
  .ex-reps { flex-shrink: 0; text-align: right; max-width: 130px; }
  .ex-reps .reps-big { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; color: var(--accent); line-height: 1.1; letter-spacing: -0.02em; }
  .ex-cue { padding: 0 18px 14px; color: var(--text-dim); font-size: 13.5px; line-height: 1.55; }
  .ex-actions { display: flex; border-top: 1px solid var(--border); }
  .ex-action { flex: 1; padding: 13px; font-size: 11px; letter-spacing: 0.12em; color: var(--text-dim); font-weight: 500; text-transform: uppercase; transition: background 0.15s, color 0.15s; }
  .ex-action:not(:last-child) { border-right: 1px solid var(--border); }
  .ex-action:active { background: var(--surface-2); }
  .ex-action.complete.done { color: var(--done); }

  .ex-log { border-top: 1px solid var(--border); padding: 16px 18px 18px; background: var(--surface-2); display: none; }
  .ex.expanded .ex-log { display: block; }
  .set-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .set-row label { font-size: 10px; color: var(--text-faint); letter-spacing: 0.14em; font-weight: 500; width: 42px; flex-shrink: 0; }
  .set-row input { flex: 1; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: 'JetBrains Mono', monospace; transition: border-color 0.15s; }
  .set-row input:focus { border-color: var(--accent-dim); }
  .notes-input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; resize: vertical; min-height: 56px; margin-top: 6px; line-height: 1.4; }
  .notes-input:focus { border-color: var(--accent-dim); }
  .notes-label { font-size: 10px; color: var(--text-faint); letter-spacing: 0.14em; margin-top: 12px; display: block; }

  .progress-view, .info-view { padding: 28px 20px 40px; }
  .progress-view h1, .info-view h1 { font-size: 40px; margin-bottom: 6px; line-height: 0.95; }
  .progress-view .sub { color: var(--text-dim); margin-bottom: 28px; font-size: 14px; }
  .progress-group { margin-bottom: 24px; }
  .progress-group-title { font-size: 11px; letter-spacing: 0.22em; color: var(--text-dim); font-weight: 500; margin-bottom: 10px; }
  .progress-exercise { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 8px; }
  .progress-exercise .pe-name { font-weight: 700; margin-bottom: 4px; font-size: 14.5px; }
  .progress-exercise .pe-goal { font-size: 11.5px; color: var(--accent); font-family: 'JetBrains Mono', monospace; margin-bottom: 12px; }
  .week-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .week-cell { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 3px; text-align: center; }
  .week-cell label { display: block; font-size: 9px; color: var(--text-faint); letter-spacing: 0.08em; margin-bottom: 3px; }
  .week-cell input { width: 100%; text-align: center; font-size: 12.5px; font-family: 'JetBrains Mono', monospace; padding: 2px 0; }
  .week-cell.current { border-color: var(--accent-dim); }
  .week-cell.current label { color: var(--accent); }

  .info-block { margin-bottom: 28px; }
  .info-block h2 { font-size: 11px; letter-spacing: 0.22em; color: var(--text-dim); font-weight: 500; margin-bottom: 10px; font-family: 'DM Sans', sans-serif; text-transform: uppercase; }
  .info-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 13px 16px; margin-bottom: 8px; }
  .info-item .ii-label { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .info-item .ii-body { color: var(--text-dim); font-size: 13px; line-height: 1.55; }
  .info-item.row { display: flex; gap: 14px; align-items: flex-start; }
  .info-item.row .ii-label { width: 110px; flex-shrink: 0; margin-bottom: 0; }
  .info-item.row .ii-body { flex: 1; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,10,0.95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--border); display: flex; z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0); }
  .nav-tab { flex: 1; padding: 12px 4px 10px; text-align: center; color: var(--text-faint); transition: color 0.15s; }
  .nav-tab.active { color: var(--accent); }
  .nav-tab .icon { display: block; margin: 0 auto 3px; width: 22px; height: 22px; }
  .nav-tab .label { font-size: 10px; letter-spacing: 0.12em; font-weight: 500; text-transform: uppercase; }

  .view { display: none; }
  .view.active { display: block; }

  .complete-banner { margin: 12px 20px 0; padding: 18px; text-align: center; background: linear-gradient(135deg, rgba(90,216,137,0.1), rgba(212,255,0,0.04)); border: 1px solid var(--done); border-radius: 14px; }
  .complete-banner .ck { font-size: 28px; color: var(--done); margin-bottom: 4px; line-height: 1; }
  .complete-banner .txt { font-weight: 700; font-size: 15px; }
  .complete-banner .sub2 { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

  @media (max-width: 360px) {
    .day-header h1 { font-size: 32px; }
    .ex-reps .reps-big { font-size: 17px; }
    .ex-name { font-size: 15.5px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div>
      <div class="week-label">WEEK</div>
      <div class="display week-num"><span id="weekNum">—</span><span class="of">/ 8</span></div>
    </div>
    <div class="phase-pill" id="phasePill">PHASE 1</div>
  </div>
  <div class="day-tabs" id="dayTabs">
    <button class="day-tab" data-day="A"><span class="day-name">TUE</span><span class="day-letter">Day A</span></button>
    <button class="day-tab" data-day="B"><span class="day-name">THU</span><span class="day-letter">Day B</span></button>
    <button class="day-tab" data-day="C"><span class="day-name">SAT</span><span class="day-letter">Day C</span></button>
  </div>
</div>

<main>
  <div class="view active" id="view-workout"></div>
  <div class="view" id="view-progress"></div>
  <div class="view" id="view-info"></div>
</main>

<nav class="bottom-nav" id="bottomNav">
  <button class="nav-tab active" data-view="workout">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4v16M18 4v16M6 12h12M3 8v8M21 8v8"/></svg>
    <span class="label">Workout</span>
  </button>
  <button class="nav-tab" data-view="progress">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M14 7h7v7"/></svg>
    <span class="label">Progress</span>
  </button>
  <button class="nav-tab" data-view="info">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span class="label">Info</span>
  </button>
</nav>

<script src="/app.js"></script>
</body>
</html>
