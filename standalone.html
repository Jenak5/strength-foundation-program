<title>Strength — Foundation Program</title>

<style>
  :root {
    --bg: #0a0a0a;
    --surface: #161616;
    --surface-2: #1f1f1f;
    --border: #2a2a2a;
    --border-strong: #3a3a3a;
    --text: #f5f5f0;
    --text-dim: #8a8a85;
    --text-faint: #555;
    --accent: #d4ff00;
    --accent-dim: #8aa800;
    --injection: #ff6b35;
    --rest: #4a9fff;
    --done: #5ad889;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; }
  body { min-height: 100dvh; padding-bottom: calc(72px + env(safe-area-inset-bottom, 0)); }
  .display { font-family: 'Anton', sans-serif; letter-spacing: 0.02em; text-transform: uppercase; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, textarea { font-family: inherit; color: inherit; background: none; border: none; outline: none; }

  .topbar { position: sticky; top: 0; z-index: 50; background: rgba(10,10,10,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top, 0); }
  .topbar-row { padding: 14px 20px 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .week-label { font-size: 11px; color: var(--text-dim); letter-spacing: 0.18em; font-weight: 500; }
  .week-num { font-size: 28px; line-height: 1; margin-top: 2px; }
  .week-num .of { font-size: 14px; color: var(--text-faint); margin-left: 4px; }
  .phase-pill { font-size: 10px; letter-spacing: 0.15em; padding: 5px 10px; border: 1px solid var(--border-strong); border-radius: 100px; color: var(--text-dim); font-weight: 500; }
  .phase-pill.phase-2 { color: var(--accent); border-color: var(--accent-dim); background: rgba(212,255,0,0.06); }

  .day-tabs { display: flex; padding: 0 12px; border-top: 1px solid var(--border); }
  .day-tab { flex: 1; padding: 12px 4px; text-align: center; border-bottom: 2px solid transparent; color: var(--text-faint); transition: color 0.15s, border-color 0.15s; position: relative; }
  .day-tab .day-name { display: block; font-size: 9px; color: var(--text-faint); margin-bottom: 2px; letter-spacing: 0.12em; }
  .day-tab .day-letter { font-family: 'Anton', sans-serif; font-size: 15px; letter-spacing: 0.05em; }
  .day-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .day-tab.active .day-name { color: var(--text-dim); }
  .day-tab.today::after { content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(20px); width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  main { max-width: 640px; margin: 0 auto; }

  .day-header { padding: 28px 20px 8px; }
  .day-header .focus { font-size: 10px; color: var(--text-dim); letter-spacing: 0.2em; margin-bottom: 6px; }
  .day-header h1 { font-size: 40px; line-height: 0.95; }
  .day-header h1 .sub { display: block; font-size: 15px; color: var(--accent); margin-top: 8px; letter-spacing: 0.05em; font-family: 'DM Sans', sans-serif; font-weight: 500; text-transform: none; }
  .day-header .session-meta { color: var(--text-dim); font-size: 13px; margin-top: 14px; line-height: 1.5; }
  .injection-tag { display: inline-flex; align-items: center; gap: 4px; color: var(--injection); border: 1px solid var(--injection); background: rgba(255,107,53,0.08); padding: 4px 9px; font-size: 10px; letter-spacing: 0.12em; border-radius: 4px; margin-left: 8px; font-weight: 500; text-transform: uppercase; }

  .rest-day { padding: 50px 20px; text-align: center; }
  .rest-day .rest-icon { width: 60px; height: 60px; margin: 0 auto 24px; border: 2px solid var(--rest); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--rest); }
  .rest-day h1 { font-size: 46px; margin-bottom: 14px; }
  .rest-day .day-name-show { color: var(--rest); font-size: 13px; letter-spacing: 0.18em; margin-bottom: 8px; font-weight: 500; }
  .rest-day p { color: var(--text-dim); margin-bottom: 8px; line-height: 1.6; max-width: 320px; margin-left: auto; margin-right: auto; }
  .rest-day .next-up { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-top: 32px; text-align: left; }
  .rest-up-label { font-size: 10px; color: var(--text-faint); letter-spacing: 0.2em; margin-bottom: 8px; }
  .rest-up-name { font-size: 22px; font-family: 'Anton', sans-serif; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; }
  .rest-up-sub { color: var(--accent); font-size: 13px; margin-top: 6px; }
  .rest-up-date { color: var(--text-dim); font-size: 13px; margin-top: 10px; }

  .section { padding: 8px 20px 16px; border-top: 1px solid var(--border); margin-top: 20px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; padding: 16px 0 12px; }
  .section-head .title { font-size: 11px; letter-spacing: 0.22em; font-weight: 500; color: var(--text-dim); }
  .section-head .duration { font-size: 11px; color: var(--text-faint); font-family: 'JetBrains Mono', monospace; }

  .ex { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; transition: border-color 0.2s, background 0.2s; position: relative; }
  .ex.done { border-color: var(--done); background: rgba(90,216,137,0.04); }
  .ex.editing { border-color: var(--accent-dim); background: var(--surface-2); }

  .ex-edit-btn { position: absolute; top: 10px; right: 10px; width: 28px; height: 28px; border-radius: 6px; color: var(--text-faint); display: flex; align-items: center; justify-content: center; transition: color 0.15s, background 0.15s; z-index: 2; }
  .ex-edit-btn:active { background: var(--surface-2); color: var(--accent); }

  .ex-head { padding: 16px 44px 14px 18px; display: flex; gap: 14px; align-items: flex-start; }
  .ex-main { flex: 1; min-width: 0; }
  .ex-name { font-size: 17px; font-weight: 700; line-height: 1.25; margin-bottom: 4px; }
  .ex-equip { font-size: 11.5px; color: var(--text-faint); letter-spacing: 0.03em; }
  .ex-reps { flex-shrink: 0; text-align: right; max-width: 130px; }
  .ex-reps .reps-big { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 20px; color: var(--accent); line-height: 1.1; letter-spacing: -0.02em; }
  .ex-cue { padding: 0 18px 14px; color: var(--text-dim); font-size: 13.5px; line-height: 1.55; }
  .ex-actions { display: flex; border-top: 1px solid var(--border); }
  .ex-action { flex: 1; padding: 13px; font-size: 11px; letter-spacing: 0.12em; color: var(--text-dim); font-weight: 500; text-transform: uppercase; transition: background 0.15s, color 0.15s; }
  .ex-action:not(:last-child) { border-right: 1px solid var(--border); }
  .ex-action:active { background: var(--surface-2); }
  .ex-action.complete.done { color: var(--done); }

  .ex-log { border-top: 1px solid var(--border); padding: 16px 18px 18px; background: var(--surface-2); display: none; }
  .ex.expanded .ex-log { display: block; }
  .set-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  .set-row label { font-size: 10px; color: var(--text-faint); letter-spacing: 0.14em; font-weight: 500; width: 42px; flex-shrink: 0; }
  .set-row input { flex: 1; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: 'JetBrains Mono', monospace; transition: border-color 0.15s; }
  .set-row input:focus { border-color: var(--accent-dim); }
  .notes-input { width: 100%; padding: 10px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; resize: vertical; min-height: 56px; margin-top: 6px; line-height: 1.4; }
  .notes-input:focus { border-color: var(--accent-dim); }
  .notes-label { font-size: 10px; color: var(--text-faint); letter-spacing: 0.14em; margin-top: 12px; display: block; }

  /* EDIT MODE */
  .ex-edit-form { padding: 18px; }
  .edit-title { font-size: 11px; letter-spacing: 0.22em; color: var(--accent); font-weight: 500; margin-bottom: 14px; }
  .edit-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .edit-row.tight { margin-bottom: 6px; }
  .edit-row.col { flex-direction: column; align-items: stretch; gap: 6px; }
  .edit-row label { font-size: 10px; color: var(--text-faint); letter-spacing: 0.14em; font-weight: 500; width: 78px; flex-shrink: 0; }
  .edit-row.col label { width: auto; }
  .edit-row input, .edit-row textarea { flex: 1; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 14.5px; transition: border-color 0.15s; width: 100%; }
  .edit-row input:focus, .edit-row textarea:focus { border-color: var(--accent-dim); }
  .edit-row textarea { font-family: inherit; resize: vertical; line-height: 1.45; }
  .edit-row-group { margin: 14px 0 12px; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  .edit-row-group-label { font-size: 10px; color: var(--accent); letter-spacing: 0.16em; font-weight: 500; margin-bottom: 10px; }
  .edit-actions { display: flex; gap: 8px; margin-top: 16px; }
  .edit-btn { flex: 1; padding: 11px; border-radius: 8px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; transition: background 0.15s, opacity 0.15s; }
  .edit-btn.save { background: var(--accent); color: #000; }
  .edit-btn.save:active { opacity: 0.8; }
  .edit-btn.cancel { background: var(--border); color: var(--text); }
  .edit-btn.delete { background: transparent; color: #ff5555; border: 1px solid #ff5555; }
  .edit-btn.delete:active { background: rgba(255,85,85,0.1); }

  /* SESSION NOTES */
  .session-notes-block { padding: 4px 20px 8px; }
  .session-notes-label { display: block; font-size: 10px; color: var(--text-faint); letter-spacing: 0.18em; font-weight: 500; margin-bottom: 8px; }
  .session-notes-input { width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; font-size: 14px; line-height: 1.5; min-height: 64px; resize: vertical; font-family: inherit; color: var(--text); transition: border-color 0.15s; }
  .session-notes-input:focus { border-color: var(--accent-dim); }

  /* ADD EXERCISE */
  .add-ex-btn { display: block; width: 100%; padding: 14px; margin-top: 6px; background: transparent; border: 1px dashed var(--border-strong); border-radius: 12px; color: var(--text-dim); font-size: 13px; letter-spacing: 0.08em; font-weight: 500; transition: color 0.15s, border-color 0.15s; }
  .add-ex-btn:active { color: var(--accent); border-color: var(--accent-dim); }
  .add-ex-form { border-color: var(--accent-dim); }

  /* RESET BUTTON */
  .reset-btn { display: block; width: 100%; padding: 14px; margin-top: 14px; background: transparent; border: 1px solid #ff5555; border-radius: 10px; color: #ff5555; font-size: 13px; letter-spacing: 0.1em; font-weight: 600; text-transform: uppercase; transition: background 0.15s; }
  .reset-btn:active { background: rgba(255,85,85,0.1); }

  .progress-view, .info-view { padding: 28px 20px 40px; }
  .progress-view h1, .info-view h1 { font-size: 40px; margin-bottom: 6px; line-height: 0.95; }
  .progress-view .sub { color: var(--text-dim); margin-bottom: 28px; font-size: 14px; }
  .progress-group { margin-bottom: 24px; }
  .progress-group-title { font-size: 11px; letter-spacing: 0.22em; color: var(--text-dim); font-weight: 500; margin-bottom: 10px; }
  .progress-exercise { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 8px; }
  .progress-exercise .pe-name { font-weight: 700; margin-bottom: 4px; font-size: 14.5px; }
  .progress-exercise .pe-goal { font-size: 11.5px; color: var(--accent); font-family: 'JetBrains Mono', monospace; margin-bottom: 12px; }
  .week-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .week-cell { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 3px; text-align: center; }
  .week-cell label { display: block; font-size: 9px; color: var(--text-faint); letter-spacing: 0.08em; margin-bottom: 3px; }
  .week-cell input { width: 100%; text-align: center; font-size: 12.5px; font-family: 'JetBrains Mono', monospace; padding: 2px 0; }
  .week-cell.current { border-color: var(--accent-dim); }
  .week-cell.current label { color: var(--accent); }

  .info-block { margin-bottom: 28px; }
  .info-block h2 { font-size: 11px; letter-spacing: 0.22em; color: var(--text-dim); font-weight: 500; margin-bottom: 10px; font-family: 'DM Sans', sans-serif; text-transform: uppercase; }
  .info-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 13px 16px; margin-bottom: 8px; }
  .info-item .ii-label { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .info-item .ii-body { color: var(--text-dim); font-size: 13px; line-height: 1.55; }
  .info-item.row { display: flex; gap: 14px; align-items: flex-start; }
  .info-item.row .ii-label { width: 110px; flex-shrink: 0; margin-bottom: 0; }
  .info-item.row .ii-body { flex: 1; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,10,0.95); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--border); display: flex; z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0); }
  .nav-tab { flex: 1; padding: 12px 4px 10px; text-align: center; color: var(--text-faint); transition: color 0.15s; }
  .nav-tab.active { color: var(--accent); }
  .nav-tab .icon { display: block; margin: 0 auto 3px; width: 22px; height: 22px; }
  .nav-tab .label { font-size: 10px; letter-spacing: 0.12em; font-weight: 500; text-transform: uppercase; }

  .view { display: none; }
  .view.active { display: block; }

  .complete-banner { margin: 12px 20px 0; padding: 18px; text-align: center; background: linear-gradient(135deg, rgba(90,216,137,0.1), rgba(212,255,0,0.04)); border: 1px solid var(--done); border-radius: 14px; }
  .complete-banner .ck { font-size: 28px; color: var(--done); margin-bottom: 4px; line-height: 1; }
  .complete-banner .txt { font-weight: 700; font-size: 15px; }
  .complete-banner .sub2 { font-size: 12px; color: var(--text-dim); margin-top: 3px; }

  @media (max-width: 360px) {
    .day-header h1 { font-size: 32px; }
    .ex-reps .reps-big { font-size: 17px; }
    .ex-name { font-size: 15.5px; }
  }
</style>
</head>

<div class="topbar">
  <div class="topbar-row">
    <div>
      <div class="week-label">WEEK</div>
      <div class="display week-num"><span id="weekNum">—</span><span class="of">/ 8</span></div>
    </div>
    <div class="phase-pill" id="phasePill">PHASE 1</div>
  </div>
  <div class="day-tabs" id="dayTabs">
    <button class="day-tab" data-day="A"><span class="day-name">TUE</span><span class="day-letter">Day A</span></button>
    <button class="day-tab" data-day="B"><span class="day-name">THU</span><span class="day-letter">Day B</span></button>
    <button class="day-tab" data-day="C"><span class="day-name">SAT</span><span class="day-letter">Day C</span></button>

<main>
  <div class="view active" id="view-workout"></div>

<nav class="bottom-nav" id="bottomNav">

    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 4v16M18 4v16M6 12h12M3 8v8M21 8v8"/></svg>

  <button class="nav-tab" data-view="progress">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M14 7h7v7"/></svg>
    <span class="label">Progress</span>
  </button>
  <button class="nav-tab" data-view="info">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    <span class="label">Info</span>
  </button>
</nav>

<script>
// ============================================================
// STRENGTH FOUNDATION PROGRAM — APP LOGIC
// ============================================================

// HTML escape for safely rendering user-typed strings inside templates
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const PROGRAM_START = new Date(2026, 4, 19); // May 19, 2026 (Tue) — Wk 1 Day A
const PROGRAM_END   = new Date(2026, 6, 11); // Jul 11, 2026 (Sat) — Wk 8 Day C

// ============================================================
// EXERCISE DATA — DEFAULT PROGRAM (seed; user can override in app)
// reps array indexed by phase block: [Wk1-2, Wk3-4, Wk5-6, Wk7-8]
// ============================================================
const DEFAULT_DAYS = {
  A: {
    title: 'Day A',
    sub: 'Lower Body + Core',
    weekday: 2, // Tuesday
    weekdayShort: 'Tue',
    weekdayLong: 'Tuesday',
    duration: '~35 min',
    equipment: 'KB 32lb · Bands · TRX · Stepper · Vest (Wk 5+)',
    injection: false,
    sections: [
      { title: 'WARM-UP', duration: '5 min', exercises: [
        { id: 'A-w1', name: 'Stair Stepper', equip: 'Mini Stair Stepper',
          reps: ['5 min · Easy pace','5 min · Moderate','5 min · Moderate-fast','5 min · Fast pace'],
          cue: 'Just get warm — not a workout yet. Light effort.', noLog: true },
      ]},
      { title: 'LOWER BODY', exercises: [
        { id: 'A-l1', name: 'Goblet Squat', equip: 'KB 32lb',
          reps: ['2×8','3×8','3×10 + light vest','3×12 + vest'],
          cue: 'Hold KB at chest. Feet shoulder-width. Sit back and down. Chest tall — don\'t round forward.' },
        { id: 'A-l2', name: 'KB Romanian Deadlift', equip: 'KB 32lb',
          reps: ['2×8','3×10','3×10 + light vest','3×12 + vest'],
          cue: 'Hinge at hips, soft knee bend. KB tracks down your shins. Feel the hamstring stretch. Drive hips forward to stand.' },
        { id: 'A-l3', name: 'TRX Assisted Squat', equip: 'TRX',
          reps: ['2×10','3×10','3×12','3×15'],
          cue: 'Hold TRX handles for balance assist. Use as little help as possible. Works depth and confidence.' },
        { id: 'A-l4', name: 'Lateral Band Walk', equip: 'Resistance Band',
          reps: ['2×10 ea','2×12 ea','3×12 ea','3×15 ea'],
          cue: 'Band just above knees. Stay in slight squat. Steps small and controlled — don\'t let knees cave.' },
        { id: 'A-l5', name: 'Banded Glute Bridge', equip: 'Resistance Band',
          reps: ['2×12','3×15','3×15 + 3 sec hold','3×20 + 3 sec hold'],
          cue: 'Band above knees. Drive through heels. Squeeze glutes at top. Lower slowly — 3 count down.' },

// ============================================================
// DATE / WEEK LOGIC
// ============================================================
function daysBetween(a, b) {
  const ms = b.setHours(0,0,0,0) - a.setHours(0,0,0,0);
  return Math.floor(ms / (1000 * 60 * 60 * 24));
}

function getCurrentWeek(today = new Date()) {
  const start = new Date(PROGRAM_START);
  const diff = daysBetween(start, new Date(today));
  if (diff < 0) return 0; // pre-program
  const wk = Math.floor(diff / 7) + 1;
  if (wk > 8) return 9; // program complete
  return wk;
}

function getRepBlock(week) {
  // 1-2 → 0, 3-4 → 1, 5-6 → 2, 7-8 → 3
  if (week <= 2) return 0;
  if (week <= 4) return 1;
  if (week <= 6) return 2;
  return 3;
}

function getPhase(week) {
  return week <= 4 ? 1 : 2;
}

function getTodayDayKey(today = new Date()) {
  const wd = today.getDay();
  if (wd === 2) return 'A';
  if (wd === 4) return 'B';
  if (wd === 6) return 'C';
  return null; // rest day
}

function getNextWorkout(today = new Date()) {
  const wd = today.getDay();
  // Next workout day index (0=Sun,1=Mon,2=Tue,3=Wed,4=Thu,5=Fri,6=Sat)
  const order = [
    { d: 2, key: 'A' },
    { d: 4, key: 'B' },
    { d: 6, key: 'C' },
  ];
  for (const o of order) {
    if (o.d > wd) {
      const dt = new Date(today);
      dt.setDate(dt.getDate() + (o.d - wd));
      return { key: o.key, date: dt };
    }
  }
  // wrap to next week Tuesday
  const dt = new Date(today);
  dt.setDate(dt.getDate() + ((2 + 7 - wd) % 7 || 7));
  return { key: 'A', date: dt };
}

function getSessionDate(dayKey, week) {
  // Program week starts on Tuesday with Day A. Wk N Day A = PROGRAM_START + (N-1)*7 days.
  // Within a week: Day A = day 0 (Tue), Day B = day 2 (Thu), Day C = day 4 (Sat)
  const anchor = new Date(PROGRAM_START);
  anchor.setDate(anchor.getDate() + (week - 1) * 7);
  const offset = dayKey === 'A' ? 0 : dayKey === 'B' ? 2 : 4;
  const dt = new Date(anchor);
  dt.setDate(dt.getDate() + offset);
  return dt;
}

function fmtDate(dt) {
  return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

// ============================================================
// STORAGE
// ============================================================
const STORAGE = {
  setLog(week, dayKey, exId, data) {
    localStorage.setItem(`log:wk${week}:${dayKey}:${exId}`, JSON.stringify(data));
  },
  getLog(week, dayKey, exId) {
    const v = localStorage.getItem(`log:wk${week}:${dayKey}:${exId}`);
    return v ? JSON.parse(v) : null;
  },
  setProgress(itemId, week, value) {
    localStorage.setItem(`prog:${itemId}:wk${week}`, value);
  },
  getProgress(itemId, week) {
    return localStorage.getItem(`prog:${itemId}:wk${week}`) || '';
  },
  isDone(week, dayKey, exId) {
    const log = this.getLog(week, dayKey, exId);
    return log && log.completed;
  },
  // Session-level notes (one per workout day per week)
  setSessionNote(week, dayKey, text) {
    const k = `sess-note:wk${week}:${dayKey}`;
    if (text && text.trim()) localStorage.setItem(k, text);
    else localStorage.removeItem(k);
  },
  getSessionNote(week, dayKey) {
    return localStorage.getItem(`sess-note:wk${week}:${dayKey}`) || '';
  },
  // Program customization (the entire DAYS object, edited by the user)
  saveProgram(days) {
    localStorage.setItem('program-v1', JSON.stringify(days));
  },
  loadProgram() {
    const v = localStorage.getItem('program-v1');
    return v ? JSON.parse(v) : null;
  },
  resetProgram() {
    localStorage.removeItem('program-v1');
  },
};

// Mutable program — seeded from DEFAULT_DAYS, but user edits persist to localStorage
let DAYS = STORAGE.loadProgram() || JSON.parse(JSON.stringify(DEFAULT_DAYS));

// Migration: if stored program is missing any day defined in DEFAULT_DAYS, merge it in.
// This preserves user edits to existing days while adding newly introduced ones (e.g. Day M).
(function migrateDays() {
  let migrated = false;
  for (const k of Object.keys(DEFAULT_DAYS)) {
    if (!DAYS[k]) {
      DAYS[k] = JSON.parse(JSON.stringify(DEFAULT_DAYS[k]));
      migrated = true;
    }
  }
  if (migrated) STORAGE.saveProgram(DAYS);
})();

    changed = true;
  }
  if (DAYS.C && DAYS.C.equipment === 'KB 32lb · TRX · Bands · Stepper · Jump Rope · Slam Ball · Vest (Wk 5+)') {
    DAYS.C.equipment = 'KB 32lb · TRX · ANCORE · Bands · Stepper · Jump Rope · Slam Ball · Vest (Wk 5+)';
    changed = true;
  }

  if (changed) STORAGE.saveProgram(DAYS);
  localStorage.setItem('migration:ancore-v1', '1');
})();

function saveProgramAndRerender() {
  STORAGE.saveProgram(DAYS);
  renderWorkout();
}

// ============================================================
// STATE
// ============================================================
const STATE = {
  view: 'workout',
  selectedDay: null, // 'A' | 'B' | 'C'
  selectedWeek: null,
  todayKey: null,
  todayWeek: null,
};

// ============================================================
// RENDER
// ============================================================
function renderTopbar() {
  document.getElementById('weekNum').textContent = STATE.selectedWeek;
  const phase = getPhase(STATE.selectedWeek);
  const pill = document.getElementById('phasePill');
  pill.textContent = `PHASE ${phase}`;
  pill.classList.toggle('phase-2', phase === 2);

  document.querySelectorAll('.day-tab').forEach(tab => {
    const d = tab.dataset.day;
    tab.classList.toggle('active', d === STATE.selectedDay);
    tab.classList.toggle('today', d === STATE.todayKey && STATE.selectedWeek === STATE.todayWeek);
  });
}

function renderWorkout() {
  const v = document.getElementById('view-workout');
  v.innerHTML = '';

  // Pre-program
  if (STATE.selectedWeek === 0) {
    v.innerHTML = `<div class="rest-day"><div class="rest-icon">⌃</div><h1 class="display">Program Starts Soon</h1><p>First session: Tue May 19, 2026 — Day A (Lower Body)</p></div>`;
    return;
  }
  if (STATE.selectedWeek === 9) {
    v.innerHTML = `<div class="rest-day"><div class="rest-icon" style="color: var(--done); border-color: var(--done);">✓</div><h1 class="display">Program Complete</h1><p>8 weeks done. Look back at your Progress tab.</p></div>`;
    return;
  }

  // Rest day (and the user is viewing today, not exploring)
  const isToday = STATE.selectedWeek === STATE.todayWeek && STATE.selectedDay === STATE.todayKey;
  const isRestDay = STATE.todayKey === null;
  // Note: even on rest day, we still render the selected workout day (user can tap a tab)
  // The rest-day view only shows when no day is selected (which shouldn't happen — we always pick a day)

  const day = DAYS[STATE.selectedDay];
  const repIdx = getRepBlock(STATE.selectedWeek);
  const hasWeekday = day.weekday !== null && day.weekday !== undefined;
  const sessionDate = hasWeekday ? getSessionDate(STATE.selectedDay, STATE.selectedWeek) : null;

  // Header
  const header = document.createElement('div');
  header.className = 'day-header';
  const todayBadge = (hasWeekday && isToday) ? `<span style="color: var(--accent); font-size: 11px; letter-spacing: 0.18em; margin-left: 8px;">· TODAY</span>` : '';
  const focusLine = hasWeekday
    ? `${esc(day.weekdayLong.toUpperCase())} · ${esc(fmtDate(sessionDate).toUpperCase())}${todayBadge}`
    : `${esc(day.weekdayLong.toUpperCase())} · WK ${STATE.selectedWeek} · PHASE ${getPhase(STATE.selectedWeek)}`;
  header.innerHTML = `
    <div class="focus">${focusLine}</div>
    <h1 class="display">${esc(day.title)}<span class="sub">${esc(day.sub)}</span></h1>
    <div class="session-meta">
      ${esc(day.duration)} · ${esc(day.equipment)}
      ${day.injection ? '<span class="injection-tag">💉 Injection Day</span>' : ''}
    </div>
    ${day.notes ? `<div class="session-meta" style="margin-top: 6px; font-style: italic;">${esc(day.notes)}</div>` : ''}
  `;
  v.appendChild(header);

  // Session-level notes (one per workout day per week)
  const noteBlock = document.createElement('div');
  noteBlock.className = 'session-notes-block';
  noteBlock.innerHTML = `
    <label class="session-notes-label">SESSION NOTES — WK ${STATE.selectedWeek} ${esc(day.title)}</label>
    <textarea class="session-notes-input" placeholder="How did today go? Energy, mood, weather, anything off…">${esc(STORAGE.getSessionNote(STATE.selectedWeek, STATE.selectedDay))}</textarea>
  `;
  noteBlock.querySelector('textarea').addEventListener('input', (e) => {
    STORAGE.setSessionNote(STATE.selectedWeek, STATE.selectedDay, e.target.value);
  });
  v.appendChild(noteBlock);

  // Completion banner if all loggable exercises done
  const loggables = day.sections.flatMap(s => s.exercises.filter(e => !e.noLog));
  const doneCount = loggables.filter(e => STORAGE.isDone(STATE.selectedWeek, STATE.selectedDay, e.id)).length;
  if (loggables.length > 0 && doneCount === loggables.length) {
    const banner = document.createElement('div');
    banner.className = 'complete-banner';
    banner.innerHTML = `<div class="ck">✓</div><div class="txt">Session complete</div><div class="sub2">${loggables.length} exercises logged — nice work.</div>`;
    v.appendChild(banner);
  }

  // Sections
  day.sections.forEach((section, sIdx) => {
    const secEl = document.createElement('section');
    secEl.className = 'section';
    secEl.innerHTML = `<div class="section-head"><div class="title">${esc(section.title)}</div>${section.duration ? `<div class="duration">${esc(section.duration)}</div>` : ''}</div>`;
    section.exercises.forEach(ex => {
      secEl.appendChild(renderExercise(ex, repIdx));
    });
    // "Add Exercise" button per section
    const addBtn = document.createElement('button');
    addBtn.className = 'add-ex-btn';
    addBtn.innerHTML = '+ Add Exercise';
    addBtn.addEventListener('click', () => openAddExerciseForm(secEl, section));
    secEl.appendChild(addBtn);
    v.appendChild(secEl);
  });
}

// Open inline "add exercise" form within a section element
function openAddExerciseForm(secEl, section) {
  // Don't double-open
  if (secEl.querySelector('.add-ex-form')) return;
  const form = document.createElement('div');
  form.className = 'ex add-ex-form editing';
  form.innerHTML = `
    <div class="ex-edit-form">
      <div class="edit-title">Add Exercise</div>
      <div class="edit-row"><label>NAME</label><input type="text" data-edit="name" placeholder="e.g., Banded Pull-Apart"></div>
      <div class="edit-row"><label>EQUIPMENT</label><input type="text" data-edit="equip" placeholder="e.g., Band"></div>
      <div class="edit-row-group">
        <div class="edit-row-group-label">SETS × REPS BY PHASE</div>
        <div class="edit-row tight"><label>Wk 1–2</label><input type="text" data-edit="rep0" placeholder="2×10"></div>
        <div class="edit-row tight"><label>Wk 3–4</label><input type="text" data-edit="rep1" placeholder="3×10"></div>
        <div class="edit-row tight"><label>Wk 5–6</label><input type="text" data-edit="rep2" placeholder="3×12"></div>
        <div class="edit-row tight"><label>Wk 7–8</label><input type="text" data-edit="rep3" placeholder="3×15"></div>
      </div>
      <div class="edit-row col"><label>COACHING CUE (optional)</label><textarea data-edit="cue" rows="3" placeholder="Form notes, what to focus on…"></textarea></div>
      <div class="edit-actions">
        <button class="edit-btn save">Add</button>
        <button class="edit-btn cancel">Cancel</button>
      </div>
    </div>
  `;
  // Insert before the "+ Add Exercise" button
  secEl.insertBefore(form, secEl.querySelector('.add-ex-btn'));

  form.querySelector('.save').addEventListener('click', () => {
    const get = sel => form.querySelector(`[data-edit="${sel}"]`).value.trim();
    const name = get('name');
    if (!name) { alert('Name is required.'); return; }
    const newEx = {
      id: 'custom-' + Date.now(),
      name,
      equip: get('equip'),
      reps: [get('rep0') || '—', get('rep1') || '—', get('rep2') || '—', get('rep3') || '—'],
      cue: get('cue'),
    };
    section.exercises.push(newEx);
    saveProgramAndRerender();
  });

  form.querySelector('.cancel').addEventListener('click', () => {
    form.remove();
  });

  // Auto-focus the name field
  setTimeout(() => form.querySelector('[data-edit="name"]').focus(), 50);
}

function renderExercise(ex, repIdx) {
  const done = STORAGE.isDone(STATE.selectedWeek, STATE.selectedDay, ex.id);
  const log = STORAGE.getLog(STATE.selectedWeek, STATE.selectedDay, ex.id) || {};
  const card = document.createElement('div');
  card.className = 'ex' + (done ? ' done' : '');
  card.dataset.exId = ex.id;

  const showLog = !ex.noLog;
  const renderViewMode = () => {
    card.innerHTML = `
      <button class="ex-edit-btn" title="Edit">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <div class="ex-head">
        <div class="ex-main">
          <div class="ex-name">${esc(ex.name)}</div>
          <div class="ex-equip">${esc(ex.equip)}</div>
        </div>
        <div class="ex-reps"><div class="reps-big">${esc(ex.reps[repIdx])}</div></div>
      </div>
      ${ex.cue ? `<div class="ex-cue">${esc(ex.cue)}</div>` : ''}
      ${showLog ? `
        <div class="ex-actions">
          <button class="ex-action expand-btn">${log.set1 || log.set2 || log.set3 || log.notes ? 'Edit Log' : 'Log Sets'}</button>
          <button class="ex-action complete ${done ? 'done' : ''}">${done ? '✓ Done' : 'Mark Done'}</button>
        </div>
        <div class="ex-log">
          <div class="set-row"><label>SET 1</label><input type="text" data-field="set1" inputmode="text" placeholder="reps · weight · notes" value="${esc(log.set1 || '')}"></div>
          <div class="set-row"><label>SET 2</label><input type="text" data-field="set2" inputmode="text" placeholder="reps · weight · notes" value="${esc(log.set2 || '')}"></div>
          <div class="set-row"><label>SET 3</label><input type="text" data-field="set3" inputmode="text" placeholder="reps · weight · notes" value="${esc(log.set3 || '')}"></div>
          <label class="notes-label">NOTES / HOW IT FELT</label>
          <textarea class="notes-input" data-field="notes" placeholder="">${esc(log.notes || '')}</textarea>
        </div>
      ` : ''}
    `;

    // Edit button
    card.querySelector('.ex-edit-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      renderEditMode();
    });

    if (showLog) {
      const expandBtn = card.querySelector('.expand-btn');
      const completeBtn = card.querySelector('.complete');

      expandBtn.addEventListener('click', () => card.classList.toggle('expanded'));

      completeBtn.addEventListener('click', () => {
        const cur = STORAGE.getLog(STATE.selectedWeek, STATE.selectedDay, ex.id) || {};
        cur.completed = !cur.completed;
        STORAGE.setLog(STATE.selectedWeek, STATE.selectedDay, ex.id, cur);
        renderWorkout();
      });

      card.querySelectorAll('input[data-field], textarea[data-field]').forEach(input => {
        input.addEventListener('input', (e) => {
          const cur = STORAGE.getLog(STATE.selectedWeek, STATE.selectedDay, ex.id) || {};
          cur[e.target.dataset.field] = e.target.value;
          STORAGE.setLog(STATE.selectedWeek, STATE.selectedDay, ex.id, cur);
        });
      });

      if (log.set1 || log.set2 || log.set3 || log.notes) {
        card.classList.add('expanded');
      }
    }
  };

  const renderEditMode = () => {
    card.classList.add('editing');
    const r = ex.reps || ['','','',''];
    card.innerHTML = `
      <div class="ex-edit-form">
        <div class="edit-title">Edit Exercise</div>
        <div class="edit-row"><label>NAME</label><input type="text" data-edit="name" value="${esc(ex.name)}"></div>
        <div class="edit-row"><label>EQUIPMENT</label><input type="text" data-edit="equip" value="${esc(ex.equip || '')}"></div>
        <div class="edit-row-group">
          <div class="edit-row-group-label">SETS × REPS BY PHASE</div>
          <div class="edit-row tight"><label>Wk 1–2</label><input type="text" data-edit="rep0" value="${esc(r[0] || '')}"></div>
          <div class="edit-row tight"><label>Wk 3–4</label><input type="text" data-edit="rep1" value="${esc(r[1] || '')}"></div>
          <div class="edit-row tight"><label>Wk 5–6</label><input type="text" data-edit="rep2" value="${esc(r[2] || '')}"></div>
          <div class="edit-row tight"><label>Wk 7–8</label><input type="text" data-edit="rep3" value="${esc(r[3] || '')}"></div>
        </div>
        <div class="edit-row col"><label>COACHING CUE</label><textarea data-edit="cue" rows="4">${esc(ex.cue || '')}</textarea></div>
        <div class="edit-actions">
          <button class="edit-btn save">Save</button>
          <button class="edit-btn cancel">Cancel</button>
          <button class="edit-btn delete">Delete</button>
        </div>
      </div>
    `;

    card.querySelector('.save').addEventListener('click', () => {
      const get = sel => card.querySelector(`[data-edit="${sel}"]`).value.trim();
      const newName = get('name');
      if (!newName) { alert('Name is required.'); return; }
      // Find the exercise in DAYS and mutate it
      const found = findExerciseInDays(ex.id);
      if (!found) return;
      found.ex.name = newName;
      found.ex.equip = get('equip');
      found.ex.reps = [get('rep0'), get('rep1'), get('rep2'), get('rep3')];
      found.ex.cue = get('cue');
      saveProgramAndRerender();
    });

    card.querySelector('.cancel').addEventListener('click', () => {
      renderViewMode();
    });

    card.querySelector('.delete').addEventListener('click', () => {
      if (!confirm(`Delete "${ex.name}"? This removes it from this day permanently (you can reset to defaults in Info).`)) return;
      const found = findExerciseInDays(ex.id);
      if (!found) return;
      found.section.exercises.splice(found.idx, 1);
      saveProgramAndRerender();
    });
  };

  renderViewMode();
  return card;
}

// Find an exercise by id across the currently selected day's sections
function findExerciseInDays(exId) {
  const day = DAYS[STATE.selectedDay];
  if (!day) return null;
  for (const section of day.sections) {
    const idx = section.exercises.findIndex(e => e.id === exId);
    if (idx !== -1) return { section, ex: section.exercises[idx], idx };
  }
  return null;
}

function setView(view) {
  STATE.view = view;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(`view-${view}`).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  // Topbar only shows on workout view
  document.querySelector('.topbar').style.display = view === 'workout' ? 'block' : 'none';
  if (view === 'progress') renderProgress();
  if (view === 'info') renderInfo();
  window.scrollTo(0, 0);
}

function selectDay(dayKey) {
  STATE.selectedDay = dayKey;
  renderTopbar();
  renderWorkout();
}

// ============================================================
// INIT
// ============================================================
function init() {
  const now = new Date();
  STATE.todayWeek = getCurrentWeek(now);
  STATE.todayKey = getTodayDayKey(now);

  // Determine default selected week + day
  if (STATE.todayWeek === 0) {
    STATE.selectedWeek = 1;
    STATE.selectedDay = 'B';
  } else if (STATE.todayWeek === 9) {
    STATE.selectedWeek = 8;
    STATE.selectedDay = 'A';
  } else {
    STATE.selectedWeek = STATE.todayWeek;
    if (STATE.todayKey) {
      STATE.selectedDay = STATE.todayKey;
    } else {
      // Rest day — show next workout
      const next = getNextWorkout(now);
      STATE.selectedDay = next.key;
      // If the next workout is in a new week, advance
      const nextWeek = getCurrentWeek(next.date);
      if (nextWeek > STATE.todayWeek && nextWeek <= 8) STATE.selectedWeek = nextWeek;
    }
  }

  // Event listeners
  document.getElementById('dayTabs').addEventListener('click', (e) => {
    const tab = e.target.closest('.day-tab');
    if (tab) selectDay(tab.dataset.day);
  });
  document.getElementById('bottomNav').addEventListener('click', (e) => {
    const tab = e.target.closest('.nav-tab');
    if (tab) setView(tab.dataset.view);
  });

  renderTopbar();
  renderWorkout();
}

document.addEventListener('DOMContentLoaded', init);
